name: Validate Cloudflare Pages SEO build
on:
  pull_request:
  push:
    branches: [master]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static site with test Cloudflare origin
        env:
          SITE_URL: https://kira-cepat-ci-example.pages.dev
        run: node scripts/build-cloudflare.mjs
      - name: Regression tests — nine calculator engines
        run: node --test tests/v45.test.cjs
      - name: Verify ten pages and SEO metadata
        env:
          SITE_URL: https://kira-cepat-ci-example.pages.dev
        run: node scripts/verify-cloudflare.mjs
      - name: Verify optional V5 integrations and preview isolation
        env:
          SITE_URL: https://kira-cepat-ci-example.pages.dev
          CF_WEB_ANALYTICS_TOKEN: '00000000000000000000000000000000'
          ADSENSE_PUBLISHER_ID: pub-0000000000000000
        run: |
          node scripts/build-cloudflare.mjs
          node scripts/verify-cloudflare.mjs
          export WORKERS_CI_BRANCH=ci-preview
          node scripts/build-cloudflare.mjs
          node scripts/verify-cloudflare.mjs
