<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Pinjaman & Zakat</title>
<meta name="description" content="Kalkulator pinjaman (bayaran bulanan, faedah) dan zakat pendapatan Malaysia. Kira percuma dalam saat.">
<meta name="keywords" content="kalkulator pinjaman, kira bayaran bulanan, kalkulator zakat, zakat pendapatan malaysia">
<meta property="og:title" content="Kalkulator Pinjaman & Zakat">
<meta property="og:description" content="Kira bayaran pinjaman bulanan & zakat pendapatan percuma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { font-family:'Inter',system-ui,sans-serif; background: radial-gradient(1200px 600px at 20% -10%, #1e3a8a 0%, transparent 60%), radial-gradient(900px 500px at 90% 10%, #7c3aed 0%, transparent 55%), #0b1020; color:#e5e7eb; margin:0; min-height:100vh; padding:40px 20px; }
  .wrap { max-width:520px; margin:auto; }
  h1 { text-align:center; font-size:28px; font-weight:800; margin:0 0 6px; background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { text-align:center; color:#9ca3af; margin-bottom:24px; font-size:14px; }
  .tabs { display:flex; gap:8px; background:rgba(255,255,255,.05); padding:6px; border-radius:14px; margin-bottom:20px; backdrop-filter:blur(8px); }
  .tab { flex:1; background:transparent; color:#9ca3af; border:none; padding:10px; border-radius:10px; cursor:pointer; font-weight:600; transition:.2s; }
  .tab.active { background:linear-gradient(135deg,#3b82f6,#8b5cf6); color:#fff; box-shadow:0 4px 14px rgba(59,130,246,.4); }
  .card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); padding:24px; border-radius:18px; backdrop-filter:blur(12px); box-shadow:0 20px 40px rgba(0,0,0,.3); }
  label { display:block; margin-top:14px; color:#cbd5e1; font-size:13px; font-weight:600; }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.3); color:#fff; margin-top:6px; font-size:15px; }
  input:focus { outline:none; border-color:#60a5fa; box-shadow:0 0 0 3px rgba(96,165,250,.2); }
  button.calc { margin-top:20px; width:100%; background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; border:none; padding:14px; border-radius:12px; cursor:pointer; font-size:16px; font-weight:700; box-shadow:0 8px 20px rgba(34,197,94,.35); transition:.2s; }
  button.calc:hover { transform:translateY(-1px); }
  .result { margin-top:20px; padding:16px; border-radius:12px; background:rgba(250,204,21,.08); border:1px solid rgba(250,204,21,.25); font-size:15px; line-height:1.7; }
  .result b { color:#facc15; font-size:20px; }
  .hidden { display:none; }
  footer { text-align:center; margin-top:30px; color:#64748b; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
<h1>Kalkulator Pinjaman & Zakat</h1>
<p class="sub">Kira bayaran bulanan & zakat pendapatan dalam saat</p>
<div class="tabs">
  <button class="tab active" onclick="show('loan')">Pinjaman</button>
  <button class="tab" onclick="show('zakat')">Zakat</button>
</div>

<div id="loan" class="card">
  <label>Jumlah Pinjaman (RM)</label>
  <input id="l_amt" type="number" value="10000">
  <label>Kadar Faedah (% setahun)</label>
  <input id="l_rate" type="number" value="5" step="0.1">
  <label>Tempoh (tahun)</label>
  <input id="l_years" type="number" value="5">
  <button class="calc" onclick="calcLoan()">Kira Sekarang</button>
  <div class="result" id="l_res">Isi nilai dan tekan Kira.</div>
</div>

<div id="zakat" class="card hidden">
  <label>Pendapatan Bulanan (RM)</label>
  <input id="z_inc" type="number" value="5000">
  <label>Nisab Tahunan (RM)</label>
  <input id="z_nisab" type="number" value="30686">
  <button class="calc" onclick="calcZakat()">Kira Zakat</button>
  <div class="result" id="z_res">Isi nilai dan tekan Kira.</div>
</div>
<footer>Share jika membantu 🙏</footer>
</div>

<script>
function show(t){
  document.getElementById('loan').classList.toggle('hidden', t!=='loan');
  document.getElementById('zakat').classList.toggle('hidden', t!=='zakat');
  const tabs=document.querySelectorAll('.tab');
  tabs[0].classList.toggle('active', t==='loan');
  tabs[1].classList.toggle('active', t==='zakat');
}
function calcLoan(){
  const P=+document.getElementById('l_amt').value;
  const r=+document.getElementById('l_rate').value/100/12;
  const n=+document.getElementById('l_years').value*12;
  if(!P||!r||!n){ document.getElementById('l_res').innerHTML='Sila isi semua nilai.'; return; }
  const m=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  const total=m*n;
  document.getElementById('l_res').innerHTML = 'Bayaran bulanan: <b>RM '+m.toFixed(2)+'</b><br>Jumlah bayar: RM '+total.toFixed(2)+'<br>Total faedah: RM '+(total-P).toFixed(2);
}
function calcZakat(){
  const inc=+document.getElementById('z_inc').value*12;
  const nisab=+document.getElementById('z_nisab').value;
  if(inc<nisab){ document.getElementById('z_res').innerHTML='Pendapatan tahunan kurang nisab. Tiada zakat pendapatan.'; return; }
  const zakat=inc*0.025;
  document.getElementById('z_res').innerHTML='Zakat pendapatan (2.5%): <b>RM '+zakat.toFixed(2)+'</b>';
}
</script>
</body>
</html>
