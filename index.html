<style>
  * { box-sizing:border-box; }
  body { font-family:'Inter',system-ui,sans-serif; background: radial-gradient(1200px 600px at 20% -10%, #1e3a8a 0%, transparent 60%), radial-gradient(900px 500px at 90% 10%, #7c3aed 0%, transparent 55%), #0b1020; color:#e5e7eb; margin:0; min-height:100vh; padding:40px 20px; }
  .wrap { max-width:560px; margin:auto; }
  h1 { text-align:center; font-size:26px; font-weight:800; margin:0 0 6px; background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { text-align:center; color:#9ca3af; margin-bottom:20px; font-size:14px; }
  .tabs { display:flex; gap:6px; background:rgba(255,255,255,.05); padding:6px; border-radius:14px; margin-bottom:20px; backdrop-filter:blur(8px); flex-wrap:wrap; }
  .tab { flex:1; min-width:80px; background:transparent; color:#9ca3af; border:none; padding:9px 6px; border-radius:10px; cursor:pointer; font-weight:600; font-size:13px; transition:.2s; }
  .tab.active { background:linear-gradient(135deg,#3b82f6,#8b5cf6); color:#fff; box-shadow:0 4px 14px rgba(59,130,246,.4); }
  .card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); padding:24px; border-radius:18px; backdrop-filter:blur(12px); box-shadow:0 20px 40px rgba(0,0,0,.3); }
  label { display:block; margin-top:12px; color:#cbd5e1; font-size:13px; font-weight:600; }
  input, select { width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.3); color:#fff; margin-top:6px; font-size:15px; }
  input:focus, select:focus { outline:none; border-color:#60a5fa; box-shadow:0 0 0 3px rgba(96,165,250,.2); }
  button.calc { margin-top:18px; width:100%; background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; border:none; padding:13px; border-radius:12px; cursor:pointer; font-size:15px; font-weight:700; box-shadow:0 8px 20px rgba(34,197,94,.35); }
  .result { margin-top:18px; padding:16px; border-radius:12px; background:rgba(250,204,21,.08); border:1px solid rgba(250,204,21,.25); font-size:15px; line-height:1.7; }
  .result b { color:#facc15; font-size:20px; }
  .hidden { display:none; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  footer { text-align:center; margin-top:30px; color:#64748b; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
<h1>Kira Cepat</h1>
<p class="sub">Kalkulator & converter percuma</p>
<div class="tabs">
  <button class="tab active" onclick="show('loan')">Pinjaman</button>
  <button class="tab" onclick="show('zakat')">Zakat</button>
  <button class="tab" onclick="show('conv')">Converter</button>
</div>

<div id="loan" class="card">
  <label>Jumlah Pinjaman (RM)</label>
  <input id="l_amt" type="number" value="10000">
  <label>Kadar Faedah (% setahun)</label>
  <input id="l_rate" type="number" value="5" step="0.1">
  <label>Tempoh (tahun)</label>
  <input id="l_years" type="number" value="5">
  <button class="calc" onclick="calcLoan()">Kira Sekarang</button>
  <div class="result" id="l_res">Isi nilai dan tekan Kira.</div>
</div>

<div id="zakat" class="card hidden">
  <label>Pendapatan Bulanan (RM)</label>
  <input id="z_inc" type="number" value="5000">
  <label>Nisab Tahunan (RM)</label>
  <input id="z_nisab" type="number" value="30686">
  <button class="calc" onclick="calcZakat()">Kira Zakat</button>
  <div class="result" id="z_res">Isi nilai dan tekan Kira.</div>
</div>

<div id="conv" class="card hidden">
  <label>Jenis</label>
  <select id="c_type" onchange="convUpdate()">
    <option value="len">Panjang</option>
    <option value="wgt">Berat</option>
    <option value="tmp">Suhu</option>
    <option value="cur">Mata Wang</option>
  </select>
  <div class="row">
    <div>
      <label>Dari</label>
      <select id="c_from"></select>
    </div>
    <div>
      <label>Ke</label>
      <select id="c_to"></select>
    </div>
  </div>
  <label>Nilai</label>
  <input id="c_val" type="number" value="1">
  <button class="calc" onclick="calcConv()">Tukar</button>
  <div class="result" id="c_res">Isi nilai dan tekan Tukar.</div>
</div>

<footer>Share jika membantu 🙏</footer>
</div>

<script>
const units = {
  len: {m:1, km:1000, cm:0.01, mm:0.001, inch:0.0254, ft:0.3048},
  wgt: {kg:1, g:0.001, lb:0.453592, oz:0.0283495},
  tmp: {C:'c', F:'f', K:'k'},
  cur: {MYR:1, USD:4.7, EUR:5.1, SGD:3.5, JPY:0.031, GBP:5.9}
};
function show(t){
  document.getElementById('loan').classList.toggle('hidden', t!=='loan');
  document.getElementById('zakat').classList.toggle('hidden', t!=='zakat');
  document.getElementById('conv').classList.toggle('hidden', t!=='conv');
  const tabs=document.querySelectorAll('.tab');
  tabs[0].classList.toggle('active', t==='loan');
  tabs[1].classList.toggle('active', t==='zakat');
  tabs[2].classList.toggle('active', t==='conv');
  if(t==='conv') convUpdate();
}
function calcLoan(){
  const P=+document.getElementById('l_amt').value;
  const r=+document.getElementById('l_rate').value/100/12;
  const n=+document.getElementById('l_years').value*12;
  if(!P||!r||!n){ document.getElementById('l_res').innerHTML='Sila isi semua nilai.'; return; }
  const m=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  const total=m*n;
  document.getElementById('l_res').innerHTML = 'Bayaran bulanan: <b>RM '+m.toFixed(2)+'</b><br>Jumlah bayar: RM '+total.toFixed(2)+'<br>Total faedah: RM '+(total-P).toFixed(2);
}
function calcZakat(){
  const inc=+document.getElementById('z_inc').value*12;
  const nisab=+document.getElementById('z_nisab').value;
  if(inc<nisab){ document.getElementById('z_res').innerHTML='Pendapatan tahunan kurang nisab. Tiada zakat pendapatan.'; return; }
  const zakat=inc*0.025;
  document.getElementById('z_res').innerHTML='Zakat pendapatan (2.5%): <b>RM '+zakat.toFixed(2)+'</b>';
}
function convUpdate(){
  const t=document.getElementById('c_type').value;
  const from=document.getElementById('c_from');
  const to=document.getElementById('c_to');
  from.innerHTML=''; to.innerHTML='';
  if(t==='tmp'){
    ['C','F','K'].forEach(u=>{ from.add(new Option(u,u)); to.add(new Option(u,u)); });
  } else {
    Object.keys(units[t]).forEach(u=>{ from.add(new Option(u,u)); to.add(new Option(u,u)); });
  }
  to.selectedIndex=1;
}
function calcConv(){
  const t=document.getElementById('c_type').value;
  const v=+document.getElementById('c_val').value;
  const f=document.getElementById('c_from').value;
  const to=document.getElementById('c_to').value;
  let res;
  if(t==='tmp'){
    let c;
    if(f==='C') c=v; else if(f==='F') c=(v-32)*5/9; else c=v-273.15;
    if(to==='C') res=c; else if(to==='F') res=c*9/5+32; else res=c+273.15;
  } else if(t==='cur'){
    res=v*units.cur[f]/units.cur[to];
  } else {
    res=v*units[t][f]/units[t][to];
  }
  document.getElementById('c_res').innerHTML = v+' '+f+' = <b>'+res.toFixed(4)+' '+to+'</b>';
}
async function loadRates(){
  try {
    const r = await fetch('https://api.exchangerate-api.com/v4/latest/MYR');
    const d = await r.json();
    if(d && d.rates){
      for(const k in units.cur){
        if(k==='MYR') units.cur[k]=1;
        else if(d.rates[k]) units.cur[k]=1/d.rates[k];
      }
    }
  } catch(e){ /* keep static fallback */ }
}
loadRates();
convUpdate();
</script>
</body>
</html>
